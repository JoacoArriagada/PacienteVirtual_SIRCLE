events {
    worker_connections 1024;
}

http {
    access_log off;

    server {
        listen 11434;

        location / {
            proxy_pass http://127.0.0.1:11435;
            proxy_set_header Host 127.0.0.1:11435;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }
}
